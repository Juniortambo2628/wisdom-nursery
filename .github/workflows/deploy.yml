name: Test and deploy

# push to `staging` -> staging (client preview link, SLA section 04)
# push to `main`    -> production
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, gd, zip, pdo_sqlite, bcmath
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # GitHub Environments "production" and "staging" each hold their own
    # DEPLOY_PATH / PHP_BIN variables (Settings > Environments).
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      # Read from the environment's variables (preferred) or, if saved there instead, its secrets.
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
      PHP_BIN: ${{ vars.PHP_BIN || secrets.PHP_BIN || 'php' }}
      RELEASE: ${{ github.sha }}
    steps:
      - name: Only main or staging deploy
        if: github.ref_name != 'main' && github.ref_name != 'staging'
        run: |
          echo "Deploys run only from main or staging (got ${{ github.ref_name }})"
          exit 1

      - name: Check configuration
        run: |
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is empty. Add it under Settings > Environments > ${{ github.ref_name == 'main' && 'production' || 'staging' }} > Environment variables (not a repository variable)."; exit 1; }
          case "$DEPLOY_PATH" in *nursery*) ;; *) echo "DEPLOY_PATH must contain 'nursery'"; exit 1;; esac

      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, gd, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Build release
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build
          rm -rf node_modules

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Secrets pasted on Windows can carry \r and stray spaces: clean them first.
          # Keep only the host name: drop any scheme, user@, :port or trailing path someone pasted.
          host="$(printf '%s' "$SSH_HOST" | tr -d '\r\n ' | sed -E 's#^[a-zA-Z]+://##; s#^[^@]*@##; s#[:/].*$##')"
          port="$(printf '%s' "${SSH_PORT:-22}" | tr -d '\r\n ')"
          user="$(printf '%s' "$SSH_USER" | tr -d '\r\n ')"
          for v in host user; do [ -n "${!v}" ] || { echo "::error::Secret SSH_${v^^} is empty"; exit 1; }; done
          case "$port" in ''|*[!0-9]*) echo "::error::Secret SSH_PORT must be a number"; exit 1;; esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "::error::SSH_PRIVATE_KEY is not a valid private key. Paste the whole file, including the BEGIN and END lines."; exit 1; }

          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          [ "$port" = 22 ] && entry="$host" || entry="[$host]:$port"
          if ! ssh-keygen -F "$entry" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::SSH_KNOWN_HOSTS has no entry for the server on port $port."
            echo "Each line must start with [host]:port when the port is not 22. Lines found start with:"
            grep -v '^#' ~/.ssh/known_hosts | awk 'NF {print "  " $1 " " $2}' | sed "s/$host/<host>/g"
            echo "Fix: run  ssh-keyscan -p $port <host>  and save all its output as SSH_KNOWN_HOSTS."
            exit 1
          fi

          cat > ~/.ssh/config <<EOF
          Host server
            HostName $host
            Port $port
            User $user
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Check the server connection
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 server 'echo "Connected as $(whoami); PHP $(php -r "echo PHP_VERSION;")"' \
            || { echo "::error::Could not log in over SSH. Check that the deploy key's public line is in ~/.ssh/authorized_keys on the server and that SSH_USER is right."; exit 1; }

      - name: Upload release
        run: |
          remote_dir="$DEPLOY_PATH/releases/$RELEASE"
          tar --exclude=.git --exclude=.github --exclude=node_modules --exclude=tests \
              --exclude=.env --exclude=storage --exclude=docs \
              -czf - . \
            | ssh server "mkdir -p $(printf %q "$remote_dir") && tar -xzf - -C $(printf %q "$remote_dir")"

      - name: Activate release
        run: |
          ssh server "DEPLOY_PATH=$(printf %q "$DEPLOY_PATH") RELEASE=$(printf %q "$RELEASE") PHP_BIN=$(printf %q "$PHP_BIN") bash -s" < deploy/remote.sh
